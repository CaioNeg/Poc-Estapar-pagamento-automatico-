spring:
  datasource:
    url: jdbc:h2:mem:tagzul_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    aws:
      sqs:
        enabled: false

grpc:
  server:
    port: -1
    in-process-name: tag-zul-grpc-test

app:
  security:
    jwt:
      secret: "estapar-tag-zul-plus-conectcar-poc-secret-key-2026-hmac-sha256"
      expiration-seconds: 3600
  conectcar:
    sqs-listener-enabled: false
