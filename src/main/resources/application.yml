spring:
  application:
    name: tag-zul-payment

  datasource:
    url: jdbc:mysql://localhost:3306/tagzul_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    aws:
      region:
        static: sa-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566

grpc:
  server:
    port: 9090

app:
  security:
    jwt:
      secret: "estapar-tag-zul-plus-conectcar-poc-secret-key-2026-hmac-sha256"
      expiration-seconds: 3600
  conectcar:
    sqs-queue-name: conectcar-passage-events-queue
